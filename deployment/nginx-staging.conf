worker_processes 1;
error_log D:/Scoop/apps/nginx/current/logs/error.log warn;
pid D:/Scoop/apps/nginx/current/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include D:/Scoop/apps/nginx/current/conf/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log D:/Scoop/apps/nginx/current/logs/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=300r/m;

    server {
        listen 80;
        server_name localhost 127.0.0.1;
        root D:/SmartSchedul/frontend/dist;
        index index.html;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Gzip Compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

        # Strict rate limiting on auth endpoints
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8080/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # General backend API proxying
        location /api/ {
            limit_req zone=api_general burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # SPA client fallback routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
