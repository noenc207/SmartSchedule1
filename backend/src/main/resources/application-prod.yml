server:
  forward-headers-strategy: framework
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:25}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      pool-name: SmartScheduleHikariProdPool
  jpa:
    hibernate:
      ddl-auto: validate
smartschedule:
  cors:
    allowed-origins: ${SMARTSCHEDULE_CORS_ALLOWED_ORIGINS}
  auth:
    jwt-secret: ${SMARTSCHEDULE_JWT_SECRET}
    secure-cookie: true
    registration-key: ${SMARTSCHEDULE_REGISTRATION_KEY}
    google-client-id: ${SMARTSCHEDULE_GOOGLE_CLIENT_ID:231472661796-1iegvpdu3jj9s845cbm46imktk73u5ss.apps.googleusercontent.com}
    github-client-id: ${SMARTSCHEDULE_GITHUB_CLIENT_ID:Ov23liGithubPreviewClientId}
    github-client-secret: ${SMARTSCHEDULE_GITHUB_CLIENT_SECRET:}
    facebook-app-id: ${SMARTSCHEDULE_FACEBOOK_APP_ID:123456789012345}
    facebook-app-secret: ${SMARTSCHEDULE_FACEBOOK_APP_SECRET:}
  plan:
    mode: ${SMARTSCHEDULE_PLAN_MODE:ALL_PRO}
  rate-limit:
    enabled: ${SMARTSCHEDULE_RATE_LIMIT_ENABLED:true}
    register-per-minute: ${SMARTSCHEDULE_RATE_LIMIT_REGISTER_PER_MIN:5}
    login-per-minute: ${SMARTSCHEDULE_RATE_LIMIT_LOGIN_PER_MIN:15}
    refresh-per-minute: ${SMARTSCHEDULE_RATE_LIMIT_REFRESH_PER_MIN:30}
  jobs:
    reminder-delay-ms: ${SMARTSCHEDULE_REMINDER_DELAY_MS:60000}
  ai:
    primary-provider: ${AI_PRIMARY_PROVIDER:wayjet}
    fallback-order: ${AI_FALLBACK_ORDER:gemini,groq,third_fallback}
    daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:20}
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:5}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    provider-cooldown-seconds: ${AI_PROVIDER_COOLDOWN_SECONDS:60}
    circuit-failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:5}
    max-retries: ${AI_MAX_RETRIES:1}
    max-message-length: ${AI_MAX_MESSAGE_LENGTH:1500}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}

    # WayJet Primary Provider
    wayjet-api-key: ${WAYJET_API_KEY:}
    wayjet-base-url: ${WAYJET_BASE_URL:https://api.xah.io/v1}
    wayjet-model: ${WAYJET_MODEL:mainnewnol/gpt-5.6-luna}

    # Gemini Fallback Provider
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.6-flash}

    # Groq Fallback Provider
    groq-api-key: ${GROQ_API_KEY:}
    groq-base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    groq-model: ${GROQ_MODEL:llama-3.3-70b-versatile}

    # Third Fallback Provider
    third-provider-api-key: ${THIRD_PROVIDER_API_KEY:}
    third-provider-base-url: ${THIRD_PROVIDER_BASE_URL:https://api.openai.com/v1}
    third-provider-model: ${THIRD_PROVIDER_MODEL:gpt-4o-mini}

