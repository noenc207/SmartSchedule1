<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Canvas Animation Renderer</title>
  <style>
    body { margin: 0; background: transparent; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas" width="320" height="320"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const animations = {
      // 1. Aurora Glow Loop
      'anim-aurora-glow-loop': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0b1120';
        ctx.fillRect(0, 0, W, H);
        const grad1 = ctx.createRadialGradient(
          W * 0.3 + Math.sin(t * Math.PI * 2) * 40,
          H * 0.4 + Math.cos(t * Math.PI * 2) * 30,
          10,
          W * 0.3, H * 0.4, 140
        );
        grad1.addColorStop(0, 'rgba(234, 88, 12, 0.7)');
        grad1.addColorStop(1, 'rgba(234, 88, 12, 0)');
        ctx.fillStyle = grad1;
        ctx.fillRect(0, 0, W, H);

        const grad2 = ctx.createRadialGradient(
          W * 0.7 - Math.cos(t * Math.PI * 2) * 35,
          H * 0.6 + Math.sin(t * Math.PI * 2) * 35,
          10,
          W * 0.7, H * 0.6, 150
        );
        grad2.addColorStop(0, 'rgba(249, 115, 22, 0.6)');
        grad2.addColorStop(1, 'rgba(2, 132, 199, 0)');
        ctx.fillStyle = grad2;
        ctx.fillRect(0, 0, W, H);
      },

      // 2. Particle Wave Flow
      'anim-particle-wave-flow': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, W, H);
        const cols = 16;
        const rows = 12;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = (c / (cols - 1)) * (W - 40) + 20;
            const yBase = (r / (rows - 1)) * (H - 60) + 30;
            const wave = Math.sin((c * 0.4) + (r * 0.3) + t * Math.PI * 2) * 16;
            const y = yBase + wave;
            const alpha = 0.3 + 0.6 * ((Math.sin(t * Math.PI * 2 + c * 0.3) + 1) / 2);
            ctx.fillStyle = `rgba(234, 88, 12, ${alpha.toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(x, y, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      },

      // 3. Geometric Pulse Core
      'anim-geometric-pulse-core': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H / 2;
        const pulse = Math.sin(t * Math.PI * 2);
        for (let i = 4; i >= 1; i--) {
          const r = 24 * i + pulse * 6 * i;
          ctx.strokeStyle = `rgba(234, 88, 12, ${(0.8 / i).toFixed(2)})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          for (let a = 0; a < 6; a++) {
            const angle = (a * Math.PI / 3) + (t * Math.PI * (i % 2 === 0 ? 1 : -1));
            const px = cx + Math.cos(angle) * r;
            const py = cy + Math.sin(angle) * r;
            if (a === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
        }
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.arc(cx, cy, 8 + pulse * 2, 0, Math.PI * 2);
        ctx.fill();
      },

      // 4. Light Sweep Beam
      'anim-light-sweep-beam': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, W, H);
        const sweepX = (t * (W * 2)) - (W * 0.5);
        const grad = ctx.createLinearGradient(sweepX - 60, 0, sweepX + 60, H);
        grad.addColorStop(0, 'rgba(234, 88, 12, 0)');
        grad.addColorStop(0.5, 'rgba(251, 146, 60, 0.45)');
        grad.addColorStop(1, 'rgba(234, 88, 12, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.strokeRect(30, 30, W - 60, H - 60);
      },

      // 5. Academic Calendar Flip
      'anim-academic-calendar-flip': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H / 2;
        // Base sheet
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.fillRect(cx - 70, cy - 80, 140, 160);
        ctx.strokeRect(cx - 70, cy - 80, 140, 160);
        // Header
        ctx.fillStyle = '#ea580c';
        ctx.fillRect(cx - 70, cy - 80, 140, 35);
        // Ring binders
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(cx - 45, cy - 90, 8, 20);
        ctx.fillRect(cx + 37, cy - 90, 8, 20);
        // Flipping wave
        const flipY = Math.sin(t * Math.PI * 2) * 20;
        ctx.fillStyle = 'rgba(234, 88, 12, 0.12)';
        ctx.fillRect(cx - 50, cy - 25, 100, 20 + flipY);
        ctx.fillStyle = '#ea580c';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(Math.floor(t * 30) + 1, cx, cy + 45);
      },

      // 6. Focus Study Clock
      'anim-focus-study-clock': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H / 2, r = 85;
        // Track
        ctx.strokeStyle = '#f1f5f9';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        // Progress arc
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (t * Math.PI * 2));
        ctx.stroke();
        // Timer center text
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        const mins = Math.floor(25 * (1 - t));
        const secs = Math.floor((1500 * (1 - t)) % 60);
        ctx.fillText(`${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`, cx, cy + 8);
      },

      // 7. Exam Milestone Path
      'anim-exam-milestone-path': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cy = H / 2;
        // Connecting line
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(50, cy);
        ctx.lineTo(270, cy);
        ctx.stroke();
        // Animated pulse along line
        const dotX = 50 + t * 220;
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(50, cy);
        ctx.lineTo(dotX, cy);
        ctx.stroke();
        // Nodes
        const nodes = [50, 160, 270];
        nodes.forEach((nx, i) => {
          const reached = dotX >= nx;
          ctx.fillStyle = reached ? '#ea580c' : '#94a3b8';
          ctx.beginPath();
          ctx.arc(nx, cy, reached ? 14 : 10, 0, Math.PI * 2);
          ctx.fill();
        });
      },

      // 8. Campus Transit Route
      'anim-campus-transit-route': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        // Pulse ring at origin
        const pulse = (t * 40) % 40;
        ctx.strokeStyle = `rgba(234, 88, 12, ${1 - t})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(80, 220, 15 + pulse, 0, Math.PI * 2);
        ctx.stroke();
        // Route path
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.lineDashOffset = -t * 24;
        ctx.beginPath();
        ctx.moveTo(80, 220);
        ctx.quadraticCurveTo(160, 100, 240, 100);
        ctx.stroke();
        ctx.setLineDash([]);
        // Pin origin
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(80, 220, 10, 0, Math.PI * 2); ctx.fill();
        // Pin destination
        ctx.fillStyle = '#ea580c';
        ctx.beginPath(); ctx.arc(240, 100, 14, 0, Math.PI * 2); ctx.fill();
      },

      // 9. Schedule Solver Loading
      'anim-schedule-solver-loading': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H / 2;
        // Ring 1
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 65, t * Math.PI * 2, t * Math.PI * 2 + Math.PI * 1.5);
        ctx.stroke();
        // Ring 2
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, 45, -t * Math.PI * 2, -t * Math.PI * 2 + Math.PI * 1.3);
        ctx.stroke();
        // Ring 3
        ctx.strokeStyle = '#fb923c';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 25, t * Math.PI * 4, t * Math.PI * 4 + Math.PI * 1.1);
        ctx.stroke();
      },

      // 10. Schedule Optimized Success
      'anim-schedule-optimized-success': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H / 2;
        // Radiant burst particles
        for (let i = 0; i < 8; i++) {
          const angle = (i * Math.PI / 4);
          const dist = 60 + Math.sin(t * Math.PI * 2) * 18;
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.arc(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        // Center Badge
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.arc(cx, cy, 45, 0, Math.PI * 2);
        ctx.fill();
        // Checkmark
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(cx - 18, cy);
        ctx.lineTo(cx - 5, cy + 14);
        ctx.lineTo(cx + 20, cy - 12);
        ctx.stroke();
      },

      // 11. Empty Schedule Zen
      'anim-empty-schedule-zen': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H / 2;
        const floatY = Math.sin(t * Math.PI * 2) * 12;
        // Sun ambient
        ctx.fillStyle = 'rgba(254, 215, 170, 0.45)';
        ctx.beginPath();
        ctx.arc(cx, cy - 30, 60, 0, Math.PI * 2);
        ctx.fill();
        // Floating open book
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, cy + 10 + floatY);
        ctx.quadraticCurveTo(cx - 30, cy + floatY, cx - 60, cy + 10 + floatY);
        ctx.lineTo(cx - 60, cy + 50 + floatY);
        ctx.quadraticCurveTo(cx - 30, cy + 40 + floatY, cx, cy + 50 + floatY);
        ctx.quadraticCurveTo(cx + 30, cy + 40 + floatY, cx + 60, cy + 50 + floatY);
        ctx.lineTo(cx + 60, cy + 10 + floatY);
        ctx.quadraticCurveTo(cx + 30, cy + floatY, cx, cy + 10 + floatY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      },

      // 12. Conflict Resolution Wave
      'anim-conflict-resolution-wave': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cy = H / 2;
        // Separation distance
        const sep = Math.abs(Math.sin(t * Math.PI * 2)) * 30;
        // Block A
        ctx.fillStyle = '#ea580c';
        ctx.fillRect(80 - sep, cy - 40, 70, 80);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('CLASS A', 85 - sep, cy + 5);
        // Block B
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(170 + sep, cy - 40, 70, 80);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CLASS B', 175 + sep, cy + 5);
      },

      // 13. 3D Crystal Polyhedron
      'anim-3d-crystal-polyhedron': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H / 2;
        const angle = t * Math.PI * 2;
        const pts = [
          [0, -70, 0],
          [50 * Math.cos(angle), -15, 50 * Math.sin(angle)],
          [50 * Math.cos(angle + Math.PI/2), 0, 50 * Math.sin(angle + Math.PI/2)],
          [50 * Math.cos(angle + Math.PI), -15, 50 * Math.sin(angle + Math.PI)],
          [50 * Math.cos(angle + Math.PI*1.5), 0, 50 * Math.sin(angle + Math.PI*1.5)],
          [0, 70, 0]
        ];
        // Draw edges
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 2.5;
        ctx.fillStyle = 'rgba(234, 88, 12, 0.12)';
        for (let i = 1; i <= 4; i++) {
          const next = i === 4 ? 1 : i + 1;
          ctx.beginPath();
          ctx.moveTo(cx + pts[0][0], cy + pts[0][1]);
          ctx.lineTo(cx + pts[i][0], cy + pts[i][1]);
          ctx.lineTo(cx + pts[next][0], cy + pts[next][1]);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(cx + pts[5][0], cy + pts[5][1]);
          ctx.lineTo(cx + pts[i][0], cy + pts[i][1]);
          ctx.lineTo(cx + pts[next][0], cy + pts[next][1]);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      },

      // 14. 3D Floating Schedule Blocks
      'anim-3d-floating-schedule-blocks': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H / 2;
        const blocks = [
          { x: -50, y: -20, h: 40, col: '#ea580c', phase: 0 },
          { x: 20, y: -45, h: 60, col: '#f97316', phase: 1.5 },
          { x: -10, y: 30, h: 50, col: '#0284c7', phase: 3 }
        ];
        blocks.forEach(b => {
          const dy = Math.sin(t * Math.PI * 2 + b.phase) * 10;
          const bx = cx + b.x;
          const by = cy + b.y + dy;
          // Isometric cube top
          ctx.fillStyle = b.col;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + 40, by - 20);
          ctx.lineTo(bx + 80, by);
          ctx.lineTo(bx + 40, by + 20);
          ctx.closePath();
          ctx.fill();
          // Isometric cube left
          ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + 40, by + 20);
          ctx.lineTo(bx + 40, by + 20 + b.h);
          ctx.lineTo(bx, by + b.h);
          ctx.closePath();
          ctx.fill();
          // Isometric cube right
          ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
          ctx.beginPath();
          ctx.moveTo(bx + 40, by + 20);
          ctx.lineTo(bx + 80, by);
          ctx.lineTo(bx + 80, by + b.h);
          ctx.lineTo(bx + 40, by + 20 + b.h);
          ctx.closePath();
          ctx.fill();
        });
      },

      // 15. 3D Sphere Wireframe Globe
      'anim-3d-sphere-wireframe-globe': (ctx, t) => {
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H / 2, r = 75;
        const angle = t * Math.PI * 2;
        // Outer ring
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        // Latitude lines
        for (let lat = -2; lat <= 2; lat++) {
          const latY = cy + (lat * (r / 3));
          const latR = Math.sqrt(Math.max(0, r * r - (latY - cy) * (latY - cy)));
          ctx.strokeStyle = 'rgba(234, 88, 12, 0.35)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(cx, latY, latR, latR * 0.3, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        // Longitude lines rotating
        for (let lon = 0; lon < 4; lon++) {
          const rot = angle + (lon * Math.PI / 4);
          const widthFactor = Math.cos(rot);
          ctx.strokeStyle = Math.sin(rot) > 0 ? '#ea580c' : 'rgba(234, 88, 12, 0.3)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(cx, cy, Math.abs(r * widthFactor), r, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    };

    window.renderFrame = (animId, t) => {
      if (animations[animId]) {
        animations[animId](ctx, t);
      }
      return ctx.getImageData(0, 0, W, H).data;
    };

    window.getAnimationList = () => Object.keys(animations);
  </script>
</body>
</html>
