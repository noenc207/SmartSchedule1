services:
  postgres:
    image: postgres:16-alpine
    container_name: smartschedule-db-prod
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=150
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartschedule}
      POSTGRES_USER: ${POSTGRES_USER:-smartschedule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartschedule_prod_change_me!}
    expose:
      - "5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./backups:/var/backups/smartschedule
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartschedule-api-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/smartschedule}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-smartschedule}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-smartschedule_prod_change_me!}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-25}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-20000}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-300000}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-1200000}
      SMARTSCHEDULE_JWT_SECRET: ${SMARTSCHEDULE_JWT_SECRET:-prod-secret-replace-in-env-file-with-minimum-32-characters!}
      SMARTSCHEDULE_SECURE_COOKIE: ${SMARTSCHEDULE_SECURE_COOKIE:-true}
      SMARTSCHEDULE_CORS_ALLOWED_ORIGINS: ${SMARTSCHEDULE_CORS_ALLOWED_ORIGINS:-https://smartschedule.example.com}
      SMARTSCHEDULE_PLAN_MODE: ${SMARTSCHEDULE_PLAN_MODE:-ALL_PRO}
      SMARTSCHEDULE_REGISTRATION_KEY: ${SMARTSCHEDULE_REGISTRATION_KEY:?SMARTSCHEDULE_REGISTRATION_KEY must be set}
      SMARTSCHEDULE_RATE_LIMIT_ENABLED: "true"
      SMARTSCHEDULE_RATE_LIMIT_REGISTER_PER_MIN: 5
      SMARTSCHEDULE_RATE_LIMIT_LOGIN_PER_MIN: 15
      SMARTSCHEDULE_RATE_LIMIT_REFRESH_PER_MIN: 30
      SMARTSCHEDULE_GOOGLE_CLIENT_ID: ${SMARTSCHEDULE_GOOGLE_CLIENT_ID:-}
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_API_MODE: real
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: smartschedule-web-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-prod-data:
